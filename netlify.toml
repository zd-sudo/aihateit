[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.hate]
  included_files = ["data/seed.json"]

[functions."hate-share"]
  included_files = ["data/seed.json", "public/index.html"]

[[redirects]]
  from = "/hate/*/og.png"
  to = "/.netlify/functions/hate-share?id=:splat&img=1"
  status = 200
  force = true

[[redirects]]
  from = "/hate/*"
  to = "/.netlify/functions/hate-share?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate/like"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate/like/"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate/"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
