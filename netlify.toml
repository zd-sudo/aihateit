[build]
  command = "node scripts/apply-ads-config.mjs && node scripts/apply-feed-snapshot.mjs"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.hate]
  included_files = ["data/seed.json"]

[functions."hate-share"]
  included_files = ["data/seed.json", "public/index.html", "public/404.html"]

[functions.stats]
  included_files = ["public/404.html"]

[functions.sitemap]
  included_files = ["data/seed.json"]

[[redirects]]
  from = "/hate/*/og.png"
  to = "/.netlify/functions/hate-share?id=:splat&img=1"
  status = 200
  force = true

[[redirects]]
  from = "/hate/*"
  to = "/.netlify/functions/hate-share?id=:splat"
  status = 200
  force = true

# After /hate/* so this alias cannot shadow permalink or og.png rewrites.
# Destination has no query string, so Netlify keeps utm_* , ref, and the rest.
[[redirects]]
  from = "/h/:id"
  to = "/hate/:id"
  status = 301

[[redirects]]
  from = "/h/:id/"
  to = "/hate/:id"
  status = 301

[[redirects]]
  from = "/api/hit"
  to = "/.netlify/functions/hit"
  status = 200
  force = true

[[redirects]]
  from = "/api/hit/"
  to = "/.netlify/functions/hit"
  status = 200
  force = true

[[redirects]]
  from = "/stats"
  to = "/.netlify/functions/stats"
  status = 200
  force = true

[[redirects]]
  from = "/stats/"
  to = "/.netlify/functions/stats"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate/like"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate/like/"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate/"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy/"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/about/"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

[[redirects]]
  from = "/thanks/"
  to = "/thanks.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/about#contact"
  status = 301

[[redirects]]
  from = "/contact/"
  to = "/about#contact"
  status = 301

# Static public/sitemap.xml would shadow this. The function lists hate permalinks.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=300"
    X-Content-Type-Options = "nosniff"
