[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.hate]
  included_files = ["data/seed.json"]

[[redirects]]
  from = "/api/hate/like"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate/like/"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[redirects]]
  from = "/api/hate/"
  to = "/.netlify/functions/hate"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
